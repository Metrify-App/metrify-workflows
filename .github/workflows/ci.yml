name: ci

# CI of the library itself: dogfooding (`make check` of this repository through its own
# check.yml), self-tests on fixtures, and contract error cases.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: library / check
    uses: $/.github/workflows/check.yml
    permissions:
      contents: read

  fixture-check:
    name: fixture / check
    uses: $/.github/workflows/check.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/plain
      node-version: "24"
    secrets:
      make-env: ${{ format('FIXTURE_TOKEN=run-{0}', github.run_id) }}

  fixture-format-check:
    name: fixture / format-check
    uses: $/.github/workflows/format-check.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/plain

  fixture-typecheck:
    name: fixture / typecheck
    uses: $/.github/workflows/typecheck.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/plain

  fixture-lint:
    name: fixture / lint
    uses: $/.github/workflows/lint.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/plain
      node-version: "24"

  fixture-test:
    name: fixture / test
    uses: $/.github/workflows/test.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/plain
      cache-paths: tests/fixtures/plain/.cache
      cache-key-files: tests/fixtures/plain/Makefile
    secrets:
      make-env: ${{ format('FIXTURE_TOKEN=run-{0}', github.run_id) }}

  fixture-build:
    name: fixture / build
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/plain
      python-version: "3.14"
      go-version: "1.26"

  fixture-docker:
    name: fixture / docker
    uses: $/.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      working-directory: tests/fixtures/plain
      image-name: metrify-workflows-fixture
      push: never

  fixture-docker-outputs:
    name: fixture / docker outputs
    needs: fixture-docker
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the outputs of a build-only run
        env:
          IMAGE: ${{ needs.fixture-docker.outputs.image }}
          TAGS: ${{ needs.fixture-docker.outputs.tags }}
          DIGEST: ${{ needs.fixture-docker.outputs.digest }}
        run: |
          test "$IMAGE" = "ghcr.io/metrify-app/metrify-workflows-fixture"
          test -z "$TAGS"
          test -z "$DIGEST"

  contract-errors:
    name: contract errors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Missing rule
        id: missing-rule
        continue-on-error: true
        uses: $/.github/actions/run-make
        with:
          rule: missing
          working-directory: tests/fixtures/plain

      - name: Missing standard verbs
        id: missing-verbs
        continue-on-error: true
        uses: $/.github/actions/run-make
        with:
          rule: check
          working-directory: tests/fixtures/missing-verbs
          check-verbs: "true"

      - name: Malformed make-env
        id: bad-env
        continue-on-error: true
        uses: $/.github/actions/run-make
        with:
          rule: lint
          working-directory: tests/fixtures/plain
          make-env: not a pair

      - name: Cache paths without key files
        id: bad-cache
        continue-on-error: true
        uses: $/.github/actions/setup-env
        with:
          cache-scope: test
          cache-paths: tests/fixtures/plain/.cache

      - name: Build an image that ignores $(IMAGE)
        uses: $/.github/actions/run-make
        with:
          rule: docker-build
          working-directory: tests/fixtures/bad-image
          make-args: IMAGE=ghcr.io/metrify-app/bad-image:sha-0000000

      - name: Check the image
        id: bad-image
        continue-on-error: true
        uses: $/.github/actions/image-push
        with:
          image: ghcr.io/metrify-app/bad-image
          build-ref: ghcr.io/metrify-app/bad-image:sha-0000000

      - name: Every case must have failed
        env:
          MISSING_RULE: ${{ steps.missing-rule.outcome }}
          MISSING_VERBS: ${{ steps.missing-verbs.outcome }}
          BAD_ENV: ${{ steps.bad-env.outcome }}
          BAD_CACHE: ${{ steps.bad-cache.outcome }}
          BAD_IMAGE: ${{ steps.bad-image.outcome }}
        run: |
          status=0
          for case in MISSING_RULE MISSING_VERBS BAD_ENV BAD_CACHE BAD_IMAGE; do
            if [[ ${!case} == failure ]]; then
              echo "ok   $case failed as expected"
            else
              echo "::error::$case: expected failure, got ${!case}"
              status=1
            fi
          done
          exit "$status"
