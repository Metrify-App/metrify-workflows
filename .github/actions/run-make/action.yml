name: run-make
description: >-
  Internal to metrify-workflows, not a public interface. Exports make-env, runs `make install`,
  optionally checks the standard verbs, then the rule (inside `nix develop` when use-nix is 'true').

inputs:
  rule:
    description: Makefile rule to run.
    required: true
  working-directory:
    description: Directory that contains the Makefile.
    default: .
  use-nix:
    description: "'true' to run make inside `nix develop`."
    default: "false"
  make-args:
    description: Space-separated VAR=VALUE words passed to make. Values cannot contain spaces.
    default: ""
  make-env:
    description: KEY=VALUE lines exported (masked) before make runs.
    default: ""
  check-verbs:
    description: "'true' to fail, after `make install`, when a standard Metrify verb is missing."
    default: "false"
  app-client-id:
    description: Client ID of a GitHub App; when set, an installation token is exported before make runs.
    default: ""
  app-private-key:
    description: Private key of that GitHub App.
    default: ""
  app-repositories:
    description: Repositories of the caller's owner the token can read, comma or newline-separated.
    default: ""
  app-token-env:
    description: Environment variable that receives the token.
    default: GITHUB_APP_TOKEN

runs:
  using: composite
  steps:
    - name: Export make-env
      if: inputs.make-env != ''
      shell: bash
      env:
        MAKE_ENV: ${{ inputs.make-env }}
      run: printf '%s\n' "$MAKE_ENV" | "$GITHUB_ACTION_PATH/../../../scripts/export-make-env.sh"

    # A read-only token of a GitHub App, for private dependencies (e.g. a private git package
    # fetched by `make install`): it expires with the job and belongs to no person.
    - name: Create a GitHub App token
      id: app-token
      if: inputs.app-client-id != ''
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ inputs.app-repositories }}
        permission-contents: read

    - name: Export the GitHub App token
      if: inputs.app-client-id != ''
      shell: bash
      env:
        TOKEN_ENV: ${{ inputs.app-token-env }}
        TOKEN: ${{ steps.app-token.outputs.token }}
      run: printf '%s=%s\n' "$TOKEN_ENV" "$TOKEN" | "$GITHUB_ACTION_PATH/../../../scripts/export-make-env.sh"

    # Every Metrify repo has `install` (see docs/contract.md); the verb runs on a fresh runner.
    - name: make install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        USE_NIX: ${{ inputs.use-nix }}
      run: '"$GITHUB_ACTION_PATH/../../../scripts/run-make.sh" install'

    # After install and make-env: a Makefile may need a secret or a generated file to parse.
    - name: Check the standard make verbs
      if: inputs.check-verbs == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        USE_NIX: ${{ inputs.use-nix }}
      run: '"$GITHUB_ACTION_PATH/../../../scripts/check-verbs.sh"'

    - name: make ${{ inputs.rule }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RULE: ${{ inputs.rule }}
        USE_NIX: ${{ inputs.use-nix }}
        MAKE_ARGS: ${{ inputs.make-args }}
      run: |
        read -ra args <<<"$MAKE_ARGS"
        "$GITHUB_ACTION_PATH/../../../scripts/run-make.sh" "$RULE" "${args[@]}"
